    <g transform="translate(144, 566)">
      <rect width="992" height="100" rx="10" fill="#16192b" stroke="#323652" stroke-width="1.2"/>
      <circle cx="26" cy="36" r="5" fill="#10b981"/>
      <text x="44" y="42" fill="#e9e9ed" font-size="20" font-weight="700" font-family="Inter, system-ui, sans-serif">通用订阅链接 vs 专属客户端选型</text>
      <text x="44" y="74" fill="#cfd3e5" font-size="14.5" font-family="Inter, system-ui, sans-serif">软路由必选支持通用订阅品牌（光速云 / 微风 / 星岛梦 / 暮光加速）</text>
      <rect x="826" y="22" width="142" height="30" rx="6" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="897" y="42" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700">RULE</text>
