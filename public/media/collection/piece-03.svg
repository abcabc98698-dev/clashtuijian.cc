      <text x="120" y="22" text-anchor="middle" fill="#cfd3e5" font-size="13">Clash订阅支持</text>
    </g>
    <g transform="translate(306, 662)">
      <rect width="240" height="34" rx="6" fill="#22263e" stroke="#3c405e"/>
      <text x="120" y="22" text-anchor="middle" fill="#cfd3e5" font-size="13">147永久套餐</text>
    </g>
    <g transform="translate(52, 706)">
      <rect width="240" height="34" rx="6" fill="#22263e" stroke="#3c405e"/>
      <text x="120" y="22" text-anchor="middle" fill="#cfd3e5" font-size="13">单节点2.5Gbps</text>
    </g>
    <g transform="translate(306, 706)">
      <rect width="240" height="34" rx="6" fill="#22263e" stroke="#3c405e"/>
      <text x="120" y="22" text-anchor="middle" fill="#cfd3e5" font-size="13">第一主推</text>
    </g>
