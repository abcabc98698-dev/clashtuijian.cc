      <text x="496" y="20" text-anchor="end" fill="#b5abfc" font-size="14">RTT 22ms · 529 Mbps</text>
      <rect x="0" y="34" width="496" height="14" rx="7" fill="#252942"/>
      <rect x="0" y="34" width="446" height="14" rx="7" fill="#b5abfc"/>
    </g>
    <g transform="translate(52, 442)">
      <text x="0" y="20" fill="#e9e9ed" font-size="15" font-weight="600">新加坡×10</text>
      <text x="496" y="20" text-anchor="end" fill="#b5abfc" font-size="14">RTT 46ms · 387 Mbps</text>
      <rect x="0" y="34" width="496" height="14" rx="7" fill="#252942"/>
      <rect x="0" y="34" width="347" height="14" rx="7" fill="#b5abfc"/>
    </g>
    <g transform="translate(52, 534)">
      <text x="0" y="20" fill="#e9e9ed" font-size="15" font-weight="600">日本×10</text>
      <text x="496" y="20" text-anchor="end" fill="#b5abfc" font-size="14">RTT 57ms · 135 Mbps</text>
      <rect x="0" y="34" width="496" height="14" rx="7" fill="#252942"/>
      <rect x="0" y="34" width="228" height="14" rx="7" fill="#b5abfc"/>
    </g>

    <!-- Capability Pills -->
