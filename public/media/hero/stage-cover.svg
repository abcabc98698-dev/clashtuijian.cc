<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ClashTuijian.cc Dark Network Observatory Telemetry Console">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d33"/>
      <stop offset="55%" stop-color="#141728"/>
      <stop offset="100%" stop-color="#0f111e"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.72" cy="0.28" r="0.65">
      <stop offset="0%" stop-color="#9184d9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#161826" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9184d9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#hbg)"/>
  <rect width="1920" height="1080" fill="url(#hglow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Observatory Top Telemetry Bar -->
  <g transform="translate(110, 96)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b2b6ca">
    <rect width="1700" height="54" rx="8" fill="#1e2136" fill-opacity="0.72" stroke="#3f4259" stroke-width="1"/>
    <circle cx="28" cy="27" r="5" fill="#10b981"/>
    <text x="46" y="32" fill="#e9e9ed" font-weight="600">OBSERVATORY // CLASHTUIJIAN.CC</text>
    <text x="390" y="32" fill="#9397ab">BATCH: 2026-Q4 TELEMETRY</text>
    <text x="680" y="32" fill="#9397ab">INDEXED PROVIDERS: 42</text>
