      <circle cx="20" cy="24" r="5" fill="#38bdf8"/>
      <text x="34" y="28" fill="#e9e9ed" font-weight="600">SGP · IEPL-CORE</text>
      <text x="20" y="50" fill="#38bdf8">RTT 46ms · 387 Mbps</text>
      <text x="20" y="66" fill="#9397ab" font-size="11">Operational · AI Ready</text>
    </g>
    <g transform="translate(990, 600)">
