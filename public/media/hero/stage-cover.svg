      <circle cx="20" cy="24" r="5" fill="#38bdf8"/>
      <text x="34" y="28" fill="#e9e9ed" font-weight="600">BGP INGRESS (CN)</text>
      <text x="20" y="50" fill="#9397ab">GZ / SH / SZ Entry</text>
    </g>
    <g transform="translate(1070, 345)">
      <rect width="230" height="76" rx="8" fill="#1e2238" stroke="#10b981" stroke-opacity="0.7"/>
      <circle cx="20" cy="24" r="5" fill="#10b981"/>
      <text x="34" y="28" fill="#e9e9ed" font-weight="600">HKG · IEPL-01</text>
      <text x="20" y="50" fill="#10b981">RTT 22ms · 529 Mbps</text>
      <text x="20" y="66" fill="#9397ab" font-size="11">Operational · Native IP</text>
    </g>
    <g transform="translate(1220, 445)">
