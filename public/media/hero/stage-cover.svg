    <path d="M 420 520 Q 780 240 1160 390" stroke="#b5abfc" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="8 6"/>
    <path d="M 420 520 Q 820 380 1290 480" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.65"/>
    <path d="M 420 520 Q 760 580 1080 640" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.5"/>
    <path d="M 1160 390 Q 1390 310 1580 430" stroke="#b5abfc" stroke-width="2" stroke-opacity="0.4"/>
  </g>

