      <circle cx="20" cy="24" r="5" fill="#b5abfc"/>
      <text x="34" y="28" fill="#e9e9ed" font-weight="600">TYO · NRT-DIRECT</text>
      <text x="20" y="50" fill="#d2cefd">RTT 53ms · 150 Mbps</text>
      <text x="20" y="66" fill="#9397ab" font-size="11">Streaming 4K Verified</text>
    </g>
    <g transform="translate(1490, 390)">
      <rect width="230" height="76" rx="8" fill="#1e2238" stroke="#f59e0b" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="5" fill="#f59e0b"/>
      <text x="34" y="28" fill="#e9e9ed" font-weight="600">LAX · US-WEST</text>
      <text x="20" y="50" fill="#fcd34d">RTT 143ms · GPT/Claude</text>
      <text x="20" y="66" fill="#9397ab" font-size="11">Cross-Pacific Link</text>
